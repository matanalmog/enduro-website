name: Weekly release (Saturday always, Thursday even ISO weeks)

# שבת 19:00: שחרור שבועי קבוע, בלי תנאי. חמישי 19:00: שחרור נוסף, אבל רק בשבועות ISO זוגיים -
# בשבועות אי-זוגיים חמישי שייך ללוח המרוצים במקום (update-races.yml), כדי שלא יצטברו 3
# דיפלויים באותו שבוע (סוכם עם תומר 10/2026: במקור חמישי+שבת שניהם קבועים, צומצם לסירוגין).
# כל הרצה ממזגת את בראנץ' dev לתוך main ודוחפת פעם אחת. אם אין ב-dev שום דבר חדש, אין push ואין דיפלוי.
# תקציב Netlify (300 קרדיטים/חודש, 15 לדיפלוי): תמיד בדיוק דיפלוי אחד ביום חמישי (שחרור או גאנט,
# אף פעם לא שניהם) ועוד אחד בשבת = עד 2 בשבוע, עד כ-9 בחודש - לא עלה מהתקציב המקורי.
on:
  schedule:
    # cron של GitHub הוא UTC בלבד. 19:00 שעון ישראל = 16:00 UTC בקיץ (IDT) ו-17:00 UTC בחורף (IST).
    # ארבע הרצות מתוזמנות (חמישי+שבת, קיץ+חורף), ושלב ה-gate למטה משאיר רק את זו שמתאימה
    # ליום ולשעון הנוכחיים בישראל, וגם בודק שבוע ISO זוגי עבור חמישי בלבד.
    - cron: "0 16 * * 4"
    - cron: "0 17 * * 4"
    - cron: "0 16 * * 6"
    - cron: "0 17 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # בודקים לפי איזה cron הופעלנו, ההיסט הנוכחי של ישראל מ-UTC, ושבוע ISO זוגי עבור חמישי -
      # לא לפי השעה/תאריך בפועל: הרצות מתוזמנות ב-GitHub מתעכבות לפעמים, ובדיקת שעה הייתה מפספסת שבוע.
      - name: Gate on Israel daylight-saving time and (for Thursday) even ISO week
        id: gate
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          offset=$(TZ=Asia/Jerusalem date +%z)
          iso_week=$(TZ=Asia/Jerusalem date +%V)

          is_even_week=false
          if [ $(( 10#$iso_week % 2 )) -eq 0 ]; then
            is_even_week=true
          fi

          thursday_match=false
          if [ "$FIRED_CRON" = "0 16 * * 4" ] && [ "$offset" = "+0300" ]; then
            thursday_match=true
          fi
          if [ "$FIRED_CRON" = "0 17 * * 4" ] && [ "$offset" = "+0200" ]; then
            thursday_match=true
          fi

          saturday_match=false
          if [ "$FIRED_CRON" = "0 16 * * 6" ] && [ "$offset" = "+0300" ]; then
            saturday_match=true
          fi
          if [ "$FIRED_CRON" = "0 17 * * 6" ] && [ "$offset" = "+0200" ]; then
            saturday_match=true
          fi

          if [ "$EVENT" = "workflow_dispatch" ] \
            || { [ "$thursday_match" = "true" ] && [ "$is_even_week" = "true" ]; } \
            || [ "$saturday_match" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Israel offset is $offset, ISO week $iso_week (even=$is_even_week); not this job's slot."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # מוצמד ל-commit SHA ולא לתגית - ראו ההסבר ב-update-races.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Merge dev into main and push
        if: steps.gate.outputs.run == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin dev > /dev/null; then
            echo "No dev branch - nothing to release."
            exit 0
          fi
          git config user.name "enduro-races-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin dev
          start=$(git rev-parse HEAD)
          if ! git merge --no-edit origin/dev -m "Weekly release: merge dev into main"; then
            git merge --abort
            echo "::error::Merging dev into main hit a conflict. Nothing was released; dev needs a manual merge."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$start" ]; then
            git push origin HEAD:main
          else
            echo "dev has nothing new - no push, no Netlify deploy."
          fi
