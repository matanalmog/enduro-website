name: Weekly release (Saturday 19:00 Israel)

# שחרור שבועי אחד לפרודקשן, כדי לחסוך בקרדיטים של Netlify (כל דיפלוי לפרודקשן = 15 קרדיטים):
#   1. מריץ את סוכן לוח התחרויות (scripts/update-races.mjs) ומתעד את src/data/races.json אם השתנה.
#   2. ממזג את בראנץ' dev (השינויים של תומר מהשבוע) לתוך main.
#   3. דוחף ל-main פעם אחת בלבד, כך ש-Netlify בונה דיפלוי אחד בשבוע. אם לא השתנה כלום, אין push ואין דיפלוי.
# שינוי דחוף: דוחפים ישירות ל-main, בלי לחכות לשבת.
on:
  schedule:
    # cron של GitHub הוא UTC בלבד. 19:00 שעון ישראל = 16:00 UTC בקיץ (IDT) ו-17:00 UTC בחורף (IST).
    # שתי ההרצות מתוזמנות, ושלב ה-gate למטה משאיר רק את זו שמתאימה לשעון הנוכחי בישראל.
    - cron: "0 16 * * 6"
    - cron: "0 17 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # בודקים לפי איזה cron הופעלנו ומה ההיסט הנוכחי של ישראל מ-UTC, ולא לפי השעה בפועל:
      # הרצות מתוזמנות ב-GitHub מתעכבות לפעמים בעשרות דקות, ובדיקת שעה הייתה מפספסת שבוע.
      - name: Gate on Israel daylight-saving time
        id: gate
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          offset=$(TZ=Asia/Jerusalem date +%z)
          if [ "$EVENT" = "workflow_dispatch" ] \
            || { [ "$FIRED_CRON" = "0 16 * * 6" ] && [ "$offset" = "+0300" ]; } \
            || { [ "$FIRED_CRON" = "0 17 * * 6" ] && [ "$offset" = "+0200" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Israel offset is $offset; the other cron entry handles this week."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # מוצמד ל-commit SHA ולא לתגית (v7...) - תגית יכולה תיאורטית להצביע מחדש למשהו אחר;
      # SHA הוא בלתי-ניתן-לשינוי. זה רץ עם הרשאת contents:write אז שרשרת האספקה חשובה כאן.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Run race calendar agent
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-races.mjs

      - name: Commit race data, merge dev, push once
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "enduro-races-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(git rev-parse HEAD)

          if git diff --quiet -- src/data/races.json; then
            echo "No changes to src/data/races.json."
          else
            git add src/data/races.json
            git commit -m "chore: update race calendar data [automated]"
          fi

          merge_failed=0
          if git ls-remote --exit-code --heads origin dev > /dev/null; then
            git fetch origin dev
            if ! git merge --no-edit origin/dev -m "Weekly release: merge dev into main"; then
              # התנגשות: משחררים לפחות את נתוני התחרויות, ומכשילים את ה-job כדי שתומר יקבל מייל.
              git merge --abort
              merge_failed=1
            fi
          fi

          if [ "$(git rev-parse HEAD)" != "$start" ]; then
            git push origin HEAD:main
            # מיישרים את dev ל-main כדי שבשבוע הבא לא תהיה התנגשות על races.json.
            if [ "$merge_failed" = "0" ] && git ls-remote --exit-code --heads origin dev > /dev/null; then
              git push origin HEAD:dev
            fi
          else
            echo "Nothing new this week - no push, no Netlify deploy."
          fi

          if [ "$merge_failed" = "1" ]; then
            echo "::error::Merging dev into main hit a conflict. Race data was released; dev needs a manual merge."
            exit 1
          fi
