name: Update race calendar (Saturday 20:00 Israel)

# מריץ את סוכן לוח התחרויות (scripts/update-races.mjs) פעם בשבוע, ומתעד (מ-commit) את
# src/data/races.json אם השתנה. כל commit כזה ל-main הוא דיפלוי לפרודקשן ב-Netlify (15 קרדיטים),
# ולכן ההרצה שבועית ולא יומית. השינויים של תומר משתחררים בנפרד ב-19:00 (weekly-release.yml).
on:
  schedule:
    # cron של GitHub הוא UTC בלבד. 20:00 שעון ישראל = 17:00 UTC בקיץ (IDT) ו-18:00 UTC בחורף (IST).
    # שתי ההרצות מתוזמנות, ושלב ה-gate למטה משאיר רק את זו שמתאימה לשעון הנוכחי בישראל.
    - cron: "0 17 * * 6"
    - cron: "0 18 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update-races:
    runs-on: ubuntu-latest
    steps:
      # בודקים לפי איזה cron הופעלנו ומה ההיסט הנוכחי של ישראל מ-UTC, ולא לפי השעה בפועל:
      # הרצות מתוזמנות ב-GitHub מתעכבות לפעמים בעשרות דקות, ובדיקת שעה הייתה מפספסת שבוע.
      - name: Gate on Israel daylight-saving time
        id: gate
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          offset=$(TZ=Asia/Jerusalem date +%z)
          if [ "$EVENT" = "workflow_dispatch" ] \
            || { [ "$FIRED_CRON" = "0 17 * * 6" ] && [ "$offset" = "+0300" ]; } \
            || { [ "$FIRED_CRON" = "0 18 * * 6" ] && [ "$offset" = "+0200" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Israel offset is $offset; the other cron entry handles this week."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # מוצמד ל-commit SHA ולא לתגית (v7...) - תגית יכולה תיאורטית להצביע מחדש למשהו אחר;
      # SHA הוא בלתי-ניתן-לשינוי. זה רץ עם הרשאת contents:write אז שרשרת האספקה חשובה כאן.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Run race calendar agent
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-races.mjs

      - name: Commit updated race data if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- src/data/races.json; then
            echo "No changes to src/data/races.json — nothing to commit."
            exit 0
          fi
          git config user.name "enduro-races-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/races.json
          git commit -m "chore: update race calendar data [automated]"
          git push
