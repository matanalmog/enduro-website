name: Daily article release (from 17:00 Israel)

# שחרור מאמרים ב-17:00: כל יום עד 21.10.2026, ומ-22.10 רק בחמישי ובשבת (תומר, 16.10). האתר מציג רק מאמרים שה-publishDate שלהם עבר בזמן ה-build,
# כך שמאמרים עתידיים יושבים ב-main מוסתרים, וצריך build חדש ביום שלהם כדי שיופיעו.
# הריצות המתוזמנות של GitHub מגיעות במאגר הזה באיחור של שעות (שחרור "19:00" רץ בפועל ב-22:00-23:00),
# לכן אין ריצה אחת ב-17:00 אלא בדיקה כל שעה: הריצה הראשונה שמגיעה אחרי 17:00 שעון ישראל, ביום שיש בו
# מאמר שעוד לא חי באתר, ממזגת את dev ל-main (או דוחפת commit ריק) ו-Netlify בונה מחדש.
# אם המאמר של היום כבר חי - הריצה לא עושה כלום, בלי deploy ובלי קרדיטים.
on:
  schedule:
    - cron: "0 9-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on Israel time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(TZ=Asia/Jerusalem date +%H)
          today=$(TZ=Asia/Jerusalem date +%F)
          run=false
          if [ "$EVENT" = "workflow_dispatch" ]; then run=true; fi
          if [ "$EVENT" = "schedule" ] && [ "$hour" -ge 17 ]; then run=true; fi
          # תומר: שחרורים יומיים מותרים רק עד 21.10.2026. מ-22.10 רק חמישי ושבת, גם הם ב-17:00 (קרדיטים של Netlify).
          dow=$(TZ=Asia/Jerusalem date +%u)
          if [ "$today" \> "2026-10-21" ] && [ "$dow" != "4" ] && [ "$dow" != "6" ]; then
            echo "From 2026-10-22 articles ship only on Thursday and Saturday."
            run=false
          fi
          echo "Israel time: $today $hour:00, event: $EVENT, run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"

      # מוצמד ל-commit SHA ולא לתגית - ראו ההסבר ב-update-races.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Find today's articles that are not live yet
        id: due
        if: steps.gate.outputs.run == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.today }}
        run: |
          git fetch origin dev main
          found=false
          for f in $(git ls-tree -r --name-only origin/dev -- src/content/blog src/content/tel-aviv-marathon); do
            case "$f" in *.md) ;; *) continue ;; esac
            content=$(git show "origin/dev:$f")
            if printf '%s\n' "$content" | grep -q '^draft:[[:space:]]*true'; then
              continue
            fi
            pd=$(printf '%s\n' "$content" | grep -m1 '^publishDate:' | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ "$pd" != "$TODAY" ]; then
              continue
            fi
            slug=$(basename "$f" .md)
            case "$f" in
              src/content/blog/*) url="https://www.sport4you.co.il/blog/$slug/" ;;
              *) url="https://www.sport4you.co.il/tel-aviv-marathon/$slug/" ;;
            esac
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || true)
            echo "Dated today: $f -> $url ($code)"
            if [ "$code" != "200" ]; then
              found=true
            fi
          done
          if [ "$found" = "false" ]; then
            echo "Nothing to release: no article dated $TODAY, or it is already live."
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Merge dev into main and push
        if: steps.gate.outputs.run == 'true' && steps.due.outputs.found == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.today }}
        run: |
          git config user.name "enduro-races-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(git rev-parse HEAD)
          # --no-ff: תמיד commit מיזוג חדש, כדי ש-[skip netlify] על הקצה של dev לא יגיע לראש main וידלג על ה-build.
          if ! git merge --no-ff --no-edit origin/dev -m "Daily article release: merge dev into main"; then
            git merge --abort
            echo "::error::Merging dev into main hit a conflict. Nothing was released; dev needs a manual merge."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$start" ]; then
            git commit --allow-empty -m "Daily article release: publish $TODAY"
          fi
          git push origin HEAD:main
